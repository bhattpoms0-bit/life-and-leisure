<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon-icon.png" />
    <title>Life &amp; Leisure Travel | Holidays &amp; Personalised Travel Planning</title>
    <meta
      name="description"
      content="Life and Leisure crafts bespoke luxury travel — curated destinations, hand-vetted hotels, and dedicated concierge support from the first idea to the final transfer home."
    />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  </head>
  <body>
    <form name="life-leisure-enquiry" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="life-leisure-enquiry" />
      <input name="bot-field" />
      <input name="schema_version" />
      <input name="service_type" />
      <input name="customer_name" />
      <input name="email" />
      <input name="phone" />
      <input name="country" />
      <input name="privacy_acknowledged" />
      <input name="privacy_notice_version" />
      <textarea name="travel_details"></textarea>
      <textarea name="travel_summary"></textarea>
      <textarea name="additional_requirements"></textarea>
      <input name="client_request_id" />
      <input name="source_path" />
      <input name="package_slug" />
      <input name="destination_context" />
      <input name="experience_context" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
